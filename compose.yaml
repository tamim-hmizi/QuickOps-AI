services:
  ollama:
    image: ollama/ollama:0.40.7
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  # Pulls the model once into the shared volume, then exits.
  model:
    image: ollama/ollama:0.40.7
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8001:8001"
    depends_on:
      model:
        condition: service_completed_successfully

volumes:
  ollama:
